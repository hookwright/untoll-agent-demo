# Present so a skeptic can recompile the shipped source and confirm the bytecode the demo deploys is the
# real thing. `npm run build:contracts` runs `forge build` here; `npm run verify:bytecode` diffs the
# result against artifacts/. The demo itself does NOT need forge: it deploys the checked-in artifacts.
[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
